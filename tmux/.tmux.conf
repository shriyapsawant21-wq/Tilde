set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB'
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g mouse on
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

set -g status-style 'bg=default,fg=colour245'
set -g status-left '#[fg=colour39,bold] #S '
set -g status-right '#[fg=colour245]%Y-%m-%d %H:%M '
setw -g window-status-current-format '#[fg=colour76,bold] #I:#W '

unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind r source-file ~/.tmux.conf \; display-message 'Tilde tmux config reloaded'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# Seamless Ctrl-h/j/k/l navigation. When Neovim is active it receives the key;
# otherwise tmux selects the adjacent pane.
is_vim="ps -o state=,comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
